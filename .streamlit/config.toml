# ==============================================================================
# Streamlit サーバー構成設定 (.streamlit/config.toml)
# Cloud Run およびローカル運用の標準設定
# ==============================================================================

[server]
headless = true
address = "0.0.0.0"
port = 8080
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 5

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#4A90E2"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2D3748"
font = "sans serif"
